    <script>
      // spa-github-pages: restore path from 404 redirect
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var decoded = decodeURIComponent(p);
          window.history.replaceState(null, '', '/' + decoded + (window.location.hash || ''));
        }
      })();
    </script>
